name: CampaignLab checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile source
        run: python -m compileall -q app.py analytics core engines schemas ui utils visualization state.py config.py

      - name: Run tests
        run: python -m pytest -q
